# Render Blueprint: creates the PostgreSQL database and the web service together.
# Render dashboard -> New -> Blueprint -> pick this repository.
databases:
  - name: smartfind-db
    plan: free
    databaseName: smartfind
    user: smartfind

services:
  - type: web
    name: smartfind-server
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    # Applies migrations, runs the (repeat-safe) seed, then starts the server
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smartfind-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CLIENT_ORIGIN
        sync: false # set in the dashboard to your React client's URL
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_SAMPLE_DATA
        value: "false" # change to "true" if you want demo data online
