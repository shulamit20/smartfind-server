# Render Blueprint: creates the web service. The PostgreSQL database is hosted on Neon.
# Render dashboard -> New -> Blueprint -> pick this repository.
services:
  - type: web
    name: smartfind-server
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    # Applies migrations, runs the (repeat-safe) seed, then starts the server
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Neon connection string (direct, not pooled) – set in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CLIENT_ORIGIN
        sync: false # set in the dashboard to your React client's URL
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_SAMPLE_DATA
        value: "true" # sample found items + demo user; change to "false" for no demo data
